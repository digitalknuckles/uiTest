<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Liquid Glass 2025 — Demo</title>
<style>
  :root {
    --bg: #070b1a;
    --card: rgba(255, 255, 255, 0.08);
    --accent: #7c3aed;
    --accent2: #06b6d4;
    --neon-glow: 0 0 25px rgba(124, 58, 237, 0.6), 0 0 45px rgba(6, 182, 212, 0.4);
  }

  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    color: #fff;
    overflow: hidden;
    background:
      linear-gradient(180deg, rgba(7,16,38,0.85) 0%, rgba(11,18,32,0.85) 100%),
      url('image.png') center center / cover no-repeat fixed;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    z-index: -1;
  }

  .wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    perspective: 1000px;
  }

  .card {
    position: relative;
    background: var(--card);
    border-radius: 20px;
    padding: 24px;
    box-shadow:
      0 6px 25px rgba(0, 0, 0, 0.45),
      inset 0 0 1px rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.15);
    transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1),
                box-shadow 0.4s ease,
                border 0.3s ease;
    width: 320px;
    height: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-style: preserve-3d;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: -50%;
    background: radial-gradient(
      circle at var(--glow-x, 50%) var(--glow-y, 50%),
      rgba(124, 58, 237, 0.18),
      rgba(6, 182, 212, 0.1),
      transparent 70%
    );
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .card:hover::before { opacity: 1; }

  img {
    width: 220px;
    height: 220px;
    object-fit: cover;
    border-radius: 18px;
    box-shadow: var(--neon-glow);
    transition: transform 0.6s ease;
  }

  @keyframes pulseGlow {
    from { box-shadow: 0 0 10px rgba(124,58,237,0.4), 0 0 20px rgba(6,182,212,0.2); }
    to { box-shadow: 0 0 25px rgba(124,58,237,0.6), 0 0 45px rgba(6,182,212,0.4); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <img src="https://i.seadn.io/s/raw/files/4f6c8204a2a1e2a5df7c404d3d1a3314.png?auto=format&dpr=1&w=384" alt="NFT PFP" />
    </div>
  </div>

<script>
(() => {
  const card = document.getElementById('card');
  let mouseX = 0, mouseY = 0;
  let targetX = 0, targetY = 0;
  let deviceTiltActive = false;

  document.addEventListener('mousemove', e => {
    const { innerWidth: w, innerHeight: h } = window;
    targetX = (e.clientX - w / 2) / w;
    targetY = (e.clientY - h / 2) / h;
  });

  window.addEventListener('deviceorientation', e => {
    const { gamma, beta, alpha } = e; // gamma=x tilt, beta=y tilt, alpha=z rotation
    // Only enable device tilt motion if z-axis (rotation) is > 15–20°
    if (Math.abs(alpha) > 15 && Math.abs(alpha) < 345) {
      deviceTiltActive = true;
      targetX = gamma / 45;
      targetY = beta / 45;
    } else {
      deviceTiltActive = false;
    }
  });

  function animate() {
    mouseX += (targetX - mouseX) * 0.08;
    mouseY += (targetY - mouseY) * 0.08;

    const rotateX = mouseY * 4;
    const rotateY = -mouseX * 4;
    card.style.transform = `
      perspective(1000px)
      rotateX(${rotateX}deg)
      rotateY(${rotateY}deg)
      translateZ(0)
    `;

    requestAnimationFrame(animate);
  }

  animate();
})();
</script>
</body>
</html>
